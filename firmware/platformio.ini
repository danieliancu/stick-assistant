; M5Stack M5StickS3 (ESP32-S3-PICO-1-N8R8: 8 MB flash, 8 MB OPI PSRAM)
; Board settings follow M5Stack's documented PlatformIO setup for StickS3:
; esp32-s3-devkitc-1 + qio_opi memory + USB CDC on boot.

[platformio]
default_envs = m5sticks3

[env:m5sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    m5stack/M5Unified@0.2.23
    m5stack/M5GFX@0.2.30
    bblanchon/ArduinoJson@7.4.3

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
